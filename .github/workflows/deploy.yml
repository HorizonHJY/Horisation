name: Deploy to EC2

on:
  push:
    branches:
      - main
    # deploy.sh restarts gunicorn. A push that only touches documentation
    # has nothing to deploy and no reason to take the site down for the
    # seconds that takes — the owner hit a 502 in that window on 2026-09-20.
    # If EVERY file in a push matches, the workflow does not run.
    paths-ignore:
      - '**.md'
      - 'Doc/**'
      - '.impeccable/**'
      - 'LICENSE'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 34.201.2.158
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Running deploy..."
            bash ~/deploy.sh
            echo "✅ Deploy complete!"
